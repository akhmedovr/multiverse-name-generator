<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Котик и пределы</title><body style="margin:0;background:#12142a;color:#fff;font:16px system-ui;display:grid;min-height:100vh;place-items:center;text-align:center;padding:24px"><p id="s">Загружаем игру…</p><script> (async()=>{try{if(!('DecompressionStream'in window))throw Error('Браузер не поддерживает распаковку игры. Обновите Safari.');const r=await fetch('./game.html.gz');if(!r.ok)throw Error('Не удалось загрузить файл игры ('+r.status+').');const ds=new DecompressionStream('gzip');const stream=r.body.pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').textContent='Ошибка загрузки: '+e.message}})();</script></body></html>
